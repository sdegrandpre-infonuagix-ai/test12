<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Private voice chat channel on Test12 — real-time voice messaging powered by xAI Grok Voice Agent API">
  <title>Private Channel — Test12</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/channel.css">
</head>
<body>
  <!-- ═══════════ AMBIENT ═══════════ -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb--1"></div>
    <div class="ambient-orb ambient-orb--2"></div>
  </div>

  <!-- ═══════════ JOIN OVERLAY ═══════════ -->
  <div id="join-overlay" class="join-overlay">
    <div class="join-card">
      <div class="join-card__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h2 id="join-channel-name">Private Voice Channel</h2>
      <p>Enter your name to join this voice chat</p>
      <input id="join-name-input" class="join-input" type="text" placeholder="Your name" maxlength="120" autocomplete="name" autofocus />
      <button id="join-btn" class="join-btn" type="button">Join Channel</button>
      <p id="join-error" class="join-error"></p>
    </div>
  </div>

  <!-- ═══════════ HEADER ═══════════ -->
  <header class="channel-header">
    <div class="header-left">
      <a href="/" class="header-back" title="Back to Test12">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="header-info">
        <div id="channel-name" class="channel-name">Loading…</div>
        <div class="channel-meta">
          <span id="channel-id-display" class="channel-id-badge"></span>
          <span id="channel-created-by"></span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div id="user-count" class="user-count">
        <div class="user-dot"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="user-count-text">0/2</span>
      </div>
      <button id="share-btn" class="share-btn" type="button" title="Copy channel link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span>Share</span>
      </button>
    </div>
  </header>

  <!-- ═══════════ MESSAGES ═══════════ -->
  <div id="messages-area" class="messages-area">
    <div class="msg-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>No messages yet. Start the conversation!</p>
    </div>
  </div>

  <!-- ═══════════ COMPOSE BAR ═══════════ -->
  <div class="compose-bar">
    <div class="compose-row">
      <textarea id="compose-input" class="compose-input" placeholder="Type a message…" rows="1" maxlength="2000"></textarea>
      <button id="voice-btn" class="compose-voice-btn" type="button" title="Hold to speak" aria-label="Voice input">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
      <button id="send-btn" class="compose-send-btn" type="button" title="Send message" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div id="voice-status" class="voice-status">
      <div class="voice-status__dot"></div>
      <span id="voice-status-text">Listening…</span>
    </div>
  </div>

  <!-- ═══════════ TOAST ═══════════ -->
  <div id="toast" class="toast"></div>

  <script src="/channel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Signing in…</title></head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:3rem;color:#64748b">Signing in…</p>
<script>
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const error = params.get('error');
  if (window.opener) {
    window.opener.postMessage(
      code ? { type: 'google-auth', code } : { type: 'google-auth-error', error: error || 'cancelled' },
      window.location.origin
    );
    setTimeout(() => window.close(), 300);
  } else {
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:3rem">You can close this tab.</p>';
  }
</script>
</body></html>
